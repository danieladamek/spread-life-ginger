  citation: 'Heitmann K et al. Safety of ginger use in pregnancy: results from a large population-based cohort study. European Journal of Clinical Pharmacology. 2012.'
  year: 2012
  summary: Heitmann and colleagues used the Norwegian Mother and Child Cohort, 68,522 women of whom 1,020 reported taking ginger, to compare those exposed to ginger in pregnancy with those not exposed. Ginger use was not associated
    with a higher risk of congenital malformations, stillbirth or perinatal death, preterm birth, low birthweight or low Apgar scores. It is the largest study of ginger safety in pregnancy and is cited by the European regulator.
