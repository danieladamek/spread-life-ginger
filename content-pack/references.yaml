  citation: Connell DW, Sutherland MD. A re-examination of gingerol, shogaol, and zingerone, the pungent principles of ginger ( Zingiber officinale Roscoe). Australian Journal of Chemistry. 1969.
  year: 1969
  summary: Connell and Sutherland re-examined the acetone extract of dried ginger rhizome and characterised its pungent principles. They established the gingerols as a homologous series of hydroxy ketones with side chains
    of different lengths, and showed that shogaols and zingerone arise from them rather than being primary constituents of the fresh plant. The paper set the chemical vocabulary that later work on ginger's pungency still uses.
  role_here: support
  role_note: 'Cited in: abstract, 3-the-chemistry-in-brief, 15-from-rhizome-to-kitchen'
