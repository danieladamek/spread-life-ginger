  summary: Morgan and Tulloss retold the 1930 epidemic of paralysis in the United States caused by an adulterated Jamaica ginger extract, known as 'jake'. The extract was drunk to evade Prohibition, and thousands of people
    were paralysed by a toxic adulterant later identified as an organophosphate. The paper traces how the epidemic was recorded in blues songs of the time.
