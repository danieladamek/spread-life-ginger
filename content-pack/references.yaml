  citation: Suzanna Maria Zick. Pharmacokinetics of 6-Gingerol, 8-Gingerol, 10-Gingerol, and 6-Shogaol and Conjugate Metabolites in Healthy Human Subjects. Cancer Epidemiology Biomarkers & Prevention. 2008.
  year: 2008
  summary: Zick and colleagues gave single oral doses of ginger extract to healthy volunteers and measured 6-, 8- and 10-gingerol and 6-shogaol in blood. The free compounds were barely detectable; almost all circulated as
    glucuronide and sulfate conjugates, which peaked within about an hour and were cleared within a few hours. The study defines the bioavailability problem for ginger in humans.
