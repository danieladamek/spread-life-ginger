- id: fig-pathway
  label: Figure 6
  title: 'How ginger makes 6-gingerol: what is shown and what is proposed'
  kind: pathway
  synthesis: conceptual
  refs:
  - 2
  - 30
  - 130
  - 131
  - 150
  data: figures/data/fig-pathway.json
  caption: The route from phenylalanine to 6-gingerol and on to 6-shogaol, as the labelling, enzyme and genome studies describe it. Solid steps have been shown with ginger material or ginger enzymes; the
    dashed step is inferred and its enzymes are not yet known; the last step is chemistry, not biology.
  how_to_read: Follow the arrows left to right. A solid arrow is a step shown experimentally, a dashed arrow is proposed, and the final arrow is the conversion that happens when ginger is dried or cooked.
    Open a box for its evidence.
  explain:
  - 'on': 'node: 6-Dehydrogingerdione'
    text: The product of the condensation step, predicted in 1980 and matched to a ginger enzyme, ZoPKS2, in 2026.
  - 'on': 'edge: two reductions'
    text: The 1980 labelling work inferred two reduction steps; the enzymes that carry them out are not yet identified in the sources read.
  - 'on': 'node: 6-Shogaol'
    text: Not made by the plant's enzymes in any study read here; it forms on heating and drying.
    term: shogaol
  concepts:
  - gingerols-and-shogaols
  discussed_in:
  - 12-the-genome-and-the-making-of-gingerols
  - 3-the-chemistry-in-brief
  source: Conceptual figure drawn by the builder from the cited studies. Nodes and edges are in figures/data/fig-pathway.json.
